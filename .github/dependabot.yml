version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # typescript-eslint (used by eslint-config-next) only supports TypeScript < 6.1.
      # Lift this once it supports TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directories: [/src/Web.Api, /frontend]
    schedule:
      interval: monthly
